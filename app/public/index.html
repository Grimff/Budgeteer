<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budgeteer</title>
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#120b16">
<!-- Add to Home Screen: opens full-screen with its own icon (manifest for Android/desktop, meta tags for iPhone/iPad). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budgeteer">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- The page (header, tabs, sections, footer, dialogs) is drawn by React: app/src/frame.jsx. -->
<div id="app" style="display:contents"></div>

<!-- The whole app: app/src (main.jsx and what it imports), built into one file by tools/build.js. -->
<script src="dist/app.js"></script>
</body>
</html>
