:root{--bg:#120b16;--s1:#1b1221;--s2:#251a2d;--s3:#31243b;--line:rgba(255,236,246,.08);--line2:rgba(255,236,246,.16);--text:#fff4fa;--mut:#bca8b9;--dim:#8d7a8b;
--pink:#ffb6d9;--lime:#d2f46b;--butter:#ffe08a;--coral:#ff8b6e;--lilac:#c6b2ff;--aqua:#82ead8;--sky:#8fc9ff;--red:#ff6b7f;--ink:#22101b;
--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 45% at 88% -8%,rgba(255,182,217,.17),transparent 70%),radial-gradient(45% 40% at -8% 105%,rgba(198,178,255,.13),transparent 70%)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.d,.big,h1,h2,h3{font-family:'Inter Display',Inter,system-ui,sans-serif}
.n{font-variant-numeric:tabular-nums}
h2{font-size:clamp(24px,2.6vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0}
h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
p{margin:0}.mut{color:var(--mut)}.dim{color:var(--dim)}

/* top bar */
.bar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px clamp(16px,4vw,44px);padding-top:max(14px,env(safe-area-inset-top));background:rgba(18,11,22,.74);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid transparent;transition:border-color .3s}
.bar.sc{border-color:var(--line)}
.brand{display:flex;align-items:center;gap:12px;font:700 19px/1.05 'Inter Display',Inter,sans-serif;letter-spacing:-.02em}
.brand small{display:block;font:500 13px/1.3 Inter,sans-serif;color:var(--mut);letter-spacing:0}
.mark{flex:none;width:40px;height:40px;border-radius:13px;background:conic-gradient(from 210deg,var(--pink),var(--butter),var(--lime),var(--aqua),var(--lilac),var(--pink));position:relative}
.mark::after{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.tabs{position:relative;display:flex;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:5px}
.tabs button{position:relative;z-index:1;border:0;background:none;color:var(--mut);font-weight:600;font-size:15.5px;padding:10px 24px;border-radius:99px;transition:color .3s}
.tabs button:hover{color:var(--text)}.tabs button.on{color:var(--ink)}
.ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:99px;background:var(--pink);box-shadow:0 6px 26px rgba(255,182,217,.35);transition:transform .5s var(--ease),width .5s var(--ease)}
.month{justify-self:end;display:flex;align-items:center;gap:4px}
.month button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s1);font-size:19px;line-height:1;display:grid;place-items:center;transition:background .2s}
.month button:hover{background:var(--s2)}
.month .ml{width:auto;border-radius:12px;padding:0 12px;font:700 17px 'Inter Display',Inter,sans-serif;letter-spacing:-.02em;border:0;background:none;min-width:150px}
.month .ml:hover{background:var(--s1)}
.month .today{width:auto;border-radius:99px;padding:0 12px;font-size:13px;font-weight:600;color:var(--pink)}
#mp{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

main{max-width:1240px;margin:0 auto;padding:10px clamp(16px,4vw,44px) 40px}
.tab.enter>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}

/* hero */
.hero{--hc:var(--pink);position:relative;overflow:hidden;isolation:isolate;border-radius:36px;padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,52px);align-items:center;margin:6px 0 18px;background:var(--s1);border:1px solid var(--line)}
.hero::before{content:'';position:absolute;z-index:-1;width:70%;aspect-ratio:1;right:-18%;top:-55%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--hc) 26%,transparent),transparent);filter:blur(8px)}
.hero .lbl{color:var(--mut);font-weight:600;font-size:16px}
.big{display:block;font-weight:800;font-size:clamp(54px,8.6vw,108px);line-height:.95;letter-spacing:-.045em;margin:10px 0 14px;color:var(--hc);font-variant-numeric:tabular-nums}
.big.neg{color:var(--red)}
.hero .note{color:var(--mut);max-width:46ch}
.hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.hl{--hc:var(--lime)}.hg{--hc:var(--lilac)}

/* buttons */
.btn{border:0;border-radius:99px;padding:11px 18px;font-weight:600;background:var(--pink);color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,182,217,.25)}
.btn.g{background:var(--s2);color:var(--text);box-shadow:none}.btn.g:hover{background:var(--s3)}
.btn.lime{background:var(--lime)}.btn.sm{padding:8px 14px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.lnk{border:0;background:none;color:var(--pink);font-weight:600;padding:4px 2px}.lnk:hover{text-decoration:underline}
.x{flex:none;border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--dim);transition:background .2s,color .2s}
.x:hover{background:var(--s3);color:var(--red)}
.add{border:1.5px dashed var(--line2);background:none;border-radius:99px;padding:8px 16px;font-weight:600;color:var(--pink);font-size:14.5px;transition:background .2s}
.add:hover{background:var(--s2)}
.seg{display:inline-flex;background:var(--s2);border-radius:99px;padding:4px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:99px;color:var(--mut);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.seg button.on{background:var(--s3);color:var(--text)}

/* cards and fields */
.card{background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:clamp(18px,2.4vw,28px)}
.bh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px;margin-bottom:18px}
.bh p{color:var(--mut);margin-top:6px;max-width:62ch}
.blk{margin:34px 0 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.in{width:100%;min-width:0;background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;transition:border-color .15s,background .15s}
.in:hover{border-color:var(--line2)}.in:focus{outline:none;border-color:var(--pink);background:var(--s3)}
.in.a{text-align:right;font-variant-numeric:tabular-nums}.in.c{text-align:center}
.in::placeholder{color:var(--dim)}

<script>
'use strict';
// ?demo / ?selftest: a sample household kept apart from your real budget (see the sample household section).
const DEMO=/[?&](demo|selftest)(=|&|$)/.test(location.search),SELFTEST=/[?&]selftest(=|&|$)/.test(location.search);
const KEY='budgeteer_v2'+(DEMO?'_demo':'');
if(DEMO)try{Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k))}catch(_){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const keyOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const NOW=new Date(),TK=keyOf(NOW);
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number);return keyOf(new Date(y,m-1+n,1))};
const mdiff=(a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by-ay)*12+(bm-am)};
const lab=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
const labS=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'})};
const mon=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long'})};
const f0=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const f2=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fk=n=>n>=1000?'$'+(+(n/1000).toFixed(1))+'k':'$'+Math.round(n);
const num=v=>{const x=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(x)?x:0};
const r2=v=>Math.round(v*100)/100;
const esc=s=>String(s??'').replace(/\uFFFD/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ord=n=>{const x=['th','st','nd','rd'],v=n%100;return n+(x[(v-20)%10]||x[v]||x[0])};
const mo=n=>n+' month'+(n===1?'':'s');
const C={pink:'#ffb6d9',lime:'#d2f46b',butter:'#ffe08a',coral:'#ff8b6e',lilac:'#c6b2ff',aqua:'#82ead8',sky:'#8fc9ff'};
const PAL=[C.butter,C.aqua,C.lilac,C.lime,C.coral,C.sky,C.pink];
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- data ---------- */
const it=(name,amt,due=0)=>({id:uid(),name,amt,due});
// Starting budget for a browser with nothing saved yet (the server copy replaces it): empty on purpose, so this file,
// which is in the GitHub repo, holds no budget data at all. The Build budget steps fill it in.
function seedPlan(){return{income:[],groups:[]}}
const seedLoans=()=>[],seedGoals=()=>[];


let S;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.plans&&Object.keys(v.plans).length){v.cur=v.cur||TK;v.tab=v.tab||'budget';v.months=v.months||{};return v}}catch(e){}
 return{plans:{[TK]:seedPlan()},loans:seedLoans(),goals:seedGoals(),months:{},cur:TK,tab:'budget',flow:'plan'}}
S=load();
let saveT,AUTOSAVE=false;function save(){if(!AUTOSAVE){try{FS.autoOnly=false}catch(_){}}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save in this browser. Download a backup to keep your changes.')}fsQueue()}

const MO=k=>S.months[k]||{act:{},pay:{},dep:{}};
const MOW=k=>{const m=S.months[k]||(S.months[k]={});m.act||(m.act={});m.pay||(m.pay={});m.dep||(m.dep={});return m};
function basePlan(k=S.cur){const ks=Object.keys(S.plans).sort();const p=[...ks].reverse().find(x=>x<=k)||ks[0];return S.plans[p]}
function plan0(k=S.cur){const b=basePlan(k),x=(S.months[k]&&S.months[k].extra)||[];if(!x.length)return b;
 return{...b,income:[...b.income,...x.filter(e=>e.kind==='inc').map(e=>({...e,once:true}))],groups:b.groups.map(g=>({...g,items:[...g.items,...x.filter(e=>e.kind==='item'&&e.gid===g.id).map(e=>({...e,once:true}))]}))}}
// The month's plan as every total uses it. A bill due every 3/6/12 months (i.freq, due month i.dm) becomes a monthly
// set-aside (amt/freq; base keeps the bill amount), so the due month never spikes; its payment comes "from the
// set-aside" (billPaid). A spending category with rollover (i.roll) adds what was left last month, or takes off
// what was overspent, capped at one month's amount; only completed months carry (PC caches the carry).
let PC={};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],FQ={3:'every 3 months',6:'twice a year',12:'yearly'};
const isDue=(i,k)=>!(+i.freq>1)||((+k.slice(5)-(+i.dm||1))%+i.freq+ +i.freq)%+i.freq===0;
const nextDue=(i,k)=>{let m=k;for(let n=0;n<12;n++,m=addM(m,1))if(isDue(i,m))return m;return k};
function carry(gid,i,k){if(!i.roll||k>TK)return 0;const pk=addM(k,-1),pg=plan0(pk).groups.find(g=>g.id===gid),pi=pg&&pg.items.find(x=>x.id===i.id);if(!pi||!pi.roll)return 0;const key=i.id+'|'+k;if(PC[key]!=null)return PC[key];
 const pl=(+pi.amt||0)+carry(gid,pi,pk),ac=flexAct(pk,i.id)||0,cap=+i.amt||0;return PC[key]=r2(Math.max(-cap,Math.min(cap,pl-ac)))}
function plan(k=S.cur){const b=plan0(k);if(!b.groups.some(g=>g.items.some(i=>+i.freq>1||i.roll)))return b;
 return{...b,groups:b.groups.map(g=>({...g,items:g.items.map(i=>{if(!g.flex&&+i.freq>1)return{...i,base:+i.amt||0,amt:r2((+i.amt||0)/+i.freq)};if(g.flex&&i.roll){const c=carry(g.id,i,k);return c?{...i,base:+i.amt||0,amt:r2((+i.amt||0)+c),carry:c}:i}return i})}))}}
function editPlan(fn,k){PC={};if(k==null)k=INB?scopeStart():S.cur;if(!S.plans[k])S.plans[k]=clone(basePlan(k));Object.keys(S.plans).sort().forEach(x=>{if(x>=k)fn(S.plans[x])})}
const extras=(k=S.cur)=>{const m=MOW(k);return m.extra||(m.extra=[])};

/* ---------- loan math ---------- */
let LP={};
// Linked loans: l.real{month: balance} and l.rp{month: payment} come from the bank (see loanSync).
// A known month-end balance (or this month's balance once it drops) replaces the estimate; the payment is
// the one the lender reported, else the one from Bank review, else worked out from the balance change.
// l.anch{k,eob} resets the opening balance in the month a loan was linked to its account: eob is the balance
// with this month's payment added back, so the opening balance is eob before one month of interest.
const bankSrc=l=>!l.acct||l.paySrc==='bank';
function path(l,mode,extra=0,from='',delta=0,cut=''){const r=l.apr/1200;let b=l.bal,k=l.start;const rows=[];const R=mode==='a'&&l.acct?l.real||{}:null,P=mode==='a'&&l.acct?l.rp||{}:{},an=l.anch,BS=bankSrc(l);
 for(let n=0;n<720&&b>0.005;n++){const pj=cut&&k>cut;if(mode==='a'&&l.done&&k>l.done&&!pj)break;let mo;if(an&&k===an.k){if(mode==='a'&&!pj){mo=b;b=anchOpen(l,k,r,R,P,BS)}else b=Math.max(0,b+delta)}
  const int=b*r,rb=R&&!pj?R[k]:undefined;
  const mp=mode==='a'&&!pj?S.months[k]?.pay?.[l.id]:undefined,useL=!pj&&P[k]!=null&&(!BS||mp==null);
  if(rb!=null&&(k<TK||rb<b-0.5)){const ex=useL?P[k]:mp,pay=ex!=null?ex:Math.max(0,b+int-rb);rows.push({k,open:b,int:Math.max(0,rb-b+pay),pay,close:rb,lg:true,auto:useL||ex==null,mo});b=rb;k=addM(k,1);continue}
  const lg=useL?P[k]:mp;let pay=lg!=null?lg:l.min+(extra&&k>=from?extra:0)+(mode==='a'&&!pj&&k>=TK&&(!cut||cut>TK)?loanXtra(l,k):0);pay=Math.max(0,Math.min(pay,b+int));const close=b+int-pay;rows.push({k,open:b,int,pay,close,lg:lg!=null,auto:useL,mo});b=close;k=addM(k,1)}
 return rows}
// Opening balance in the month a loan was linked. Once the lender's balance shows that month's payment (the
// month is over, the payment came from the lender, or the balance was read after the bank payment), back-solve
// it: open = (balance + payment) / (1 + rate). Until then: the balance at linking (payment added back) less one
// month of interest. (A lender's balance at linking can leave out accrued interest.)
function anchOpen(l,k,r,R,P,BS){const an=l.anch,rb=R&&R[k],mp=S.months[k]?.pay?.[l.id],uL=P[k]!=null&&(!BS||mp==null),ex=uL?P[k]:mp;
 if(rb!=null&&ex!=null){const pd=Object.values(S.txd||{}).reduce((m,x)=>x.v==='l:'+l.id&&x.k===k&&(x.d||'')>m?x.d:m,''),at=(l.live&&l.live.at||'').slice(0,10);if(k<TK||uL||(pd&&at>pd))return (rb+ex)/(1+r)}
 return an.eob!=null?an.eob/(1+r):an.open}
const sumI=rows=>rows.reduce((a,r)=>a+r.int,0);
function lp(l){if(LP[l.id])return LP[l.id];const a=path(l,'a'),an=l.anch,ar=an&&a.find(x=>x.k===an.k),d=ar&&ar.mo!=null?ar.open-ar.mo:0;return LP[l.id]={a,b:path(l,'b',0,'',d),d,c:{}}}
// The path with payments as made/planned through month k and minimums after it (cached per month).
function cutP(l,k){const P=lp(l);return P.c[k]||(P.c[k]=path(l,'a',0,'',P.d,k))}
function row(l,k){const i=mdiff(l.start,k),a=lp(l).a;return i>=0&&i<a.length?a[i]:null}
function balEnd(l,k){if(k<l.start)return l.bal;const r=row(l,k);return r?r.close:0}
// Paid off before month k: tracking had started and the balance path already ended. Such loans leave the
// Budget tab and move to the Loans page's Paid off section from the month after the last payment.
function loanGone(l,k=S.cur){return k>=l.start&&!row(l,k)}
// Planned extra above the minimum: the month's own amount (Build budget) if set, else the loan's usual extra.
function loanXo(l,k){const v=S.months[k]&&S.months[k].lxp&&S.months[k].lxp[l.id];return v==null?null:+v}
// Usual planned extra: versions l.xp{YYYY-MM: amount}, each in force from its month (like plan versions), so setting
// an extra never changes months before it. A month's own amount (Build → Just for <month>) wins: months[k].lxp.
// Amounts that change over time are kept as versions map{YYYY-MM: amount}, each in force from its month on.
// verSet(o,f,m,v) sets o[f] from month m on and drops later versions, so earlier months never change.
function verAt(map,k){let v=0;Object.keys(map||{}).sort().forEach(m=>{if(m<=k)v=+map[m]||0});return v}
function verSet(o,f,m,v){if(f==='mp'&&o.id&&S.goals.includes(o))return alSet('g:'+o.id,m,v);o[f]||(o[f]={});Object.keys(o[f]).forEach(x=>{if(x>=m)delete o[f][x]});if(Math.abs(verAt(o[f],m)-v)>0.004)o[f][m]=r2(v);if(!Object.keys(o[f]).length)delete o[f]}
function loanUsual(l,k){return alPlan('l:'+l.id,k)}
function setUsual(l,m,v){alSet('l:'+l.id,m,v)}
const xStart=()=>S.cur>TK?S.cur:TK;   // extras are set from the viewed month on, never before the current one
function loanXtra(l,k){const o=loanXo(l,k);return Math.max(0,o||0)+exShare('l:'+l.id,k)}
// What the budget plans to pay: the minimum plus planned extra, never more than is owed.
function loanPlan(l,k){if(k<l.start)return l.min+loanXtra(l,k);const r=row(l,k);if(!r)return 0;const due=r.open+r.int;return Math.min(Math.min(l.min,due)+loanXtra(l,k),due)}
function loanMin(l,k){if(k<l.start)return l.min;const r=row(l,k);return r?Math.min(l.min,r.open+r.int):0}
// Interest saved by month k: lifetime interest on the minimum-only path minus lifetime interest when the extra paid
// (or planned, for future months) through k is made and only minimums after. Never below $0; never falls as k moves on.
function savedL(l,k=S.cur){return Math.max(0,sumI(lp(l).b)-sumI(cutP(l,k)))}
function sooner(l){const p=lp(l);return p.b.length-p.a.length}
function stuck(l){return lp(l).b.length>=720}
function extraPaid(l,k=S.cur){return cutP(l,k).reduce((a,r)=>a+(r.k<=k&&(r.lg||r.k>=TK)?Math.max(0,r.pay-Math.min(l.min,r.open+r.int)):0),0)}
function withPay(l,k,amt){const m=MOW(k),old=m.pay[l.id];m.pay[l.id]=amt;const a=path(l,'a');if(old===undefined)delete m.pay[l.id];else m.pay[l.id]=old;return a}
function payEffect(l,k,amt){const lo=withPay(l,k,Math.min(l.min,(row(l,k)||{open:l.bal,int:0}).open*(1+l.apr/1200))),hi=withPay(l,k,amt);return{saved:sumI(lo)-sumI(hi),months:lo.length-hi.length}}
function streak(){const ext=k=>S.loans.some(l=>{const r=row(l,k);return r&&r.lg&&r.pay>Math.min(l.min,r.open+r.int)+0.005});let k=TK,n=0;if(!ext(k))k=addM(k,-1);for(let g=0;g<600&&ext(k);g++){n++;k=addM(k,-1)}return n}
const lastK=rows=>rows.length?rows[rows.length-1].k:TK;

/* ---------- budget math ---------- */
// A goal is what you add by hand (saved before tracking + logged deposits) plus the balances of any linked accounts.
function manualSaved(g,k=S.cur){let s=+g.saved||0;Object.keys(S.months).forEach(x=>{if(x<=k)s+=+(S.months[x].dep?.[g.id]||0)});return s}
const gAccts=g=>Object.keys(S.alloc||{}).filter(aid=>(S.alloc[aid].goals||[]).includes(g.id)).map(aid=>(BK.accts||[]).find(a=>a.id===aid)).filter(Boolean);
function acctAt(a,k){if(k>=TK)return +a.bal||0;let v=null;Object.keys(a.months||{}).sort().forEach(m=>{if(m<=k)v=a.months[m]});return v}
function linkedSaved(g,k=S.cur){return allocAt(k).out[g.id]||0}
// Change in linked balances during month k. The month an account starts being tracked counts from its first balance, not from 0.
// Investment accounts (brokerage, IRA, 401(k)/403(b)): balances move with the market, so "saved this month" counts
// contributions, not the balance change. Contributions come from Plaid's investment transactions (a.flows, + = money in).
const isInv=a=>!!a&&a.type==='investment';
// A contribution "from home" matches a checking/savings payment of the same amount within 5 days (a Roth IRA transfer).
// One with no match came straight from a paycheck (401(k)/403(b)) and never was take-home pay.
function fromHome(f){const day=d=>Date.parse(d)/864e5;return BK.tx.some(t=>acctType(t.account)==='depository'&&Math.abs(t.amount-f.amt)<0.01&&Math.abs(day(t.date)-day(f.date))<=5)}
function flowsIn(a,k,home){return r2((a.flows||[]).filter(f=>f.date&&f.date.slice(0,7)===k&&(home==null||fromHome(f)===home)).reduce((x,f)=>x+(+f.amt||0),0))}
// This goal's share of an account in month k (0..1), from how the account's balance is divided.
function goalShare(aid,gid,k){const a=(BK.accts||[]).find(x=>x.id===aid),B=a?acctAt(a,k):0,v=(allocAt(k).by[aid]||{})[gid]||0;return B>0?v/B:0}
// Change in this goal's linked accounts during month k that counts as saving (Budget totals, "saved this month"):
// savings accounts = change in its share; investment accounts = its share of contributions from take-home pay.
function linkedChange(g,k=S.cur){let x=0;Object.entries(S.alloc||{}).forEach(([aid,e])=>{if(!(e.goals||[]).includes(g.id))return;const a=(BK.accts||[]).find(y=>y.id===aid);if(!a)return;

async function demoFetch(u,o={}){const url=new URL(String(u),location.href);if(!url.pathname.includes('/api/'))return REALFETCH(u,o);
 const p=url.pathname.slice(url.pathname.indexOf('/api/')),m=(o.method||'GET').toUpperCase(),D=DEMOD||(DEMOD=sampleData()),J=(code,b)=>new Response(JSON.stringify(b),{status:code,headers:{'Content-Type':'application/json'}}),body=()=>{try{return JSON.parse(o.body||'{}')}catch(_){return{}}};
 if(p==='/api/health')return J(200,{ok:true,app:'budgeteer',demo:true});

 if(p==='/api/data'&&m==='PUT'){const b=body();if(b.baseRev!=null&&b.baseRev!==D.rev)return J(409,{error:'changed',rev:D.rev});D.rev+=2;D.budget=b.data;D.saves=(D.saves||0)+1;return J(200,{rev:D.rev,savedAt:new Date().toISOString()})}
 if(p==='/api/data')return J(200,{app:'budgeteer',rev:D.rev,data:clone(D.budget)});

 if(p==='/api/bank/transactions'){const f=url.searchParams.get('from')||'0000';return J(200,{tx:D.tx.filter(t=>t.date>=f)})}

// Self-test: runs once the sample household has loaded and filed. Each check compares the app's own numbers with
// figures worked out here straight from the sample transactions, then every tab and view is drawn.
async function selfTest(){const T=[],ok=(c,name,detail='')=>T.push({ok:!!c,name,detail:String(detail)}),errs=[],onErr=e=>errs.push(String(e.message||e.reason||e));
 addEventListener('error',onErr);addEventListener('unhandledrejection',onErr);
 const D=DEMOD,past=addM(TK,-1),near=(a,b)=>Math.abs(a-b)<0.01,sumTx=(k,re,acct)=>r2(D.tx.filter(t=>t.date.startsWith(k)&&re.test(t.name)&&(!acct||t.account===acct)).reduce((a,t)=>a+t.amount,0));
 try{
  ok(BK.tx.length===D.tx.length&&BK.accts.length===5,'Sample bank data loaded',`${BK.tx.length} transactions, ${BK.accts.length} accounts`);
  ok(inbox().length===0,'Every sample transaction is filed',`${inbox().length} left to review`);
  // Income, a fixed bill, groceries and dining for last month, straight from the transactions.
  const inc=incGot(past,'pay'),rent=billPaid(past,'rent'),groc=flexAct(past,'groc'),din=flexAct(past,'dining');
  ok(inc&&near(inc.amt,-sumTx(past,/PAYROLL/)),'Paychecks counted once',`${inc&&f2(inc.amt)} vs ${f2(-sumTx(past,/PAYROLL/))}`);
  ok(rent&&near(rent.amt,1850),'Rent paid',rent&&f2(rent.amt));
  ok(near(groc,sumTx(past,/FRESH MARKET|GREEN GROCER/)),'Groceries match the store charges',`${f2(groc)} vs ${f2(sumTx(past,/FRESH MARKET|GREEN GROCER/))}`);
  ok(near(din,sumTx(past,/BISTRO|TACO|PIZZA/)),'Dining matches the restaurant charges',f2(din));
  // Card payments, savings transfers and loan payments are transfers, never spending.
  const T0=totals(past),spentCard=sumTx(past,/./,'card')-sumTx(past,/AUTOPAY PAYMENT/,'card'),fixedChk=sumTx(past,/RENT|POWER|FASTNET/,'chk')+100;   // + the car insurance set-aside (600 every 6 months)
  ok(near(T0.fixedA+T0.flexA,r2(spentCard+fixedChk)),'Spending = purchases and bills (card payments and transfers left out)',`${f2(T0.fixedA+T0.flexA)} vs ${f2(spentCard+fixedChk)}`);
  ok(near(T0.loansA,380),'Car loan payment filed to the loan',f2(T0.loansA));
  // Set-aside bill: car insurance paid every 6 months counts as 100 a month.
  ok(near(plan(past).groups.find(g=>g.id==='bills').items.find(i=>i.id==='ins').amt,100),'Twice-a-year bill is set aside monthly');
  // Loans: the balance path pays off, and an extra 200/month pays off sooner with less interest.
  const car=S.loans.find(l=>l.id==='car'),base=path(car,'b'),more=path(car,'b',200);
  ok(base.length>1&&base[base.length-1].close<0.01,'Car loan pays off on schedule',`${base.length} months`);
  ok(more.length<base.length,'Extra payments pay it off sooner',`${base.length} → ${more.length} months`);
  // Goals: the emergency fund is the savings account's balance; the trip goal has a date and a monthly amount.
  const sav=BK.accts.find(a=>a.id==='sav'),em=S.goals.find(g=>g.id==='emerg'),trip=S.goals.find(g=>g.id==='trip');
  ok(near(goalSaved(em,TK),sav.bal),'Emergency fund follows the savings balance',`${f2(goalSaved(em,TK))} vs ${f2(sav.bal)}`);
  ok(goalMon(trip,TK)===250&&goalEta(trip),'Trip goal has its monthly amount and a finish month',`${f0(goalMon(trip,TK))}/month, done ${goalEta(trip)&&labS(goalEta(trip))}`);
  // Tracking the student loan from the bank: the app's balance follows the lender's.
  linkLoan('sloan');const sl=S.loans.find(l=>l.acct==='sloan'),lender=BK.loans.find(a=>a.id==='sloan').bal;
  ok(sl&&Math.abs(debtNow(sl)-lender)<1,'Tracked student loan matches the lender',sl&&`${f2(debtNow(sl))} vs ${f2(lender)}`);
  // Adding a goal gives it the usual 200 a month.
  const n0=S.goals.length;document.querySelector('.tabs button[data-t="goals"]').click();document.querySelector('[data-act="addGoal"]').click();const ng=S.goals[n0];
  ok(ng&&goalMon(ng,TK)===200,'A new goal starts at 200 a month',ng&&f0(goalMon(ng,TK)));
  // The app's own health checks.
  healthChecks().forEach(h=>ok(h.lv==='ok','Health check: '+h.t.replace(/<[^>]+>/g,''),h.lv==='ok'?'':h.d.replace(/<[^>]+>/g,'')));
  // Saving reaches the (sample) server.
  await new Promise(r=>setTimeout(r,1200));ok((D.saves||0)>0&&FS.state==='ok','Changes save to the server',`${D.saves||0} save(s)`);
  // Draw every tab and every view; nothing may throw.
  const clickAll=sel=>[...document.querySelectorAll(sel)].filter(b=>b.offsetParent).forEach(b=>b.click());
  for(const t of['budget','loans','goals','wealth','history','bank','settings']){document.querySelector(`.tabs button[data-t="${t}"]`).click();const el=document.querySelector('#T-'+t);ok(!el.hidden&&el.innerHTML.length>200,`${t[0].toUpperCase()+t.slice(1)} tab draws`,`${el.innerHTML.length} characters`);
   ['budv','sview','bview','hrng','bfilt'].forEach(a=>clickAll(`#T-${t} [data-act="${a}"]`))}
  ok(!errs.length,'No errors while drawing',errs.slice(0,3).join(' · '))}
 catch(e){ok(false,'Self-test crashed',e.stack||e.message)}
 removeEventListener('error',onErr);removeEventListener('unhandledrejection',onErr);
 const bad=T.filter(t=>!t.ok);document.title=bad.length?`SELFTEST FAIL ${bad.length}`:'SELFTEST PASS';
 const box=document.createElement('section');box.className='card selftest';box.innerHTML=`<h2>${bad.length?`Self-test: ${bad.length} of ${T.length} checks failed`:`Self-test passed: ${T.length} checks`}</h2><ul>${T.map(t=>`<li class="${t.ok?'ok':'bad'}">${t.ok?'✓':'×'} ${esc(t.name)}${t.detail?` <span class="dim">· ${esc(t.detail)}</span>`:''}</li>`).join('')}</ul><pre id="selftest-result" hidden>${esc(JSON.stringify({pass:!bad.length,total:T.length,failed:bad}))}</pre>`;
 document.body.prepend(box);window.SELFTEST={pass:!bad.length,results:T};return window.SELFTEST}
// Start the self-test once the sample household has loaded (server copy adopted, bank data in, filing done).
if(SELFTEST){const t0=Date.now(),wait=()=>{if(FS.state==='ok'&&BK.accts&&BK.tx.length&&DEMOD)return setTimeout(selfTest,300);if(Date.now()-t0<15000)setTimeout(wait,100);else{document.title='SELFTEST FAIL load';document.body.insertAdjacentHTML('afterbegin','<pre id="selftest-result">{"pass":false,"failed":[{"name":"Sample household never loaded"}]}</pre>')}};setTimeout(wait,0)}   // after the rest of the script has run

/* ---------- budget on the server ---------- */
// The budget lives on the server (server.js, GET/PUT api/data). This browser keeps a copy in localStorage (KEY), so
// edits made while the server can't be reached aren't lost: PEND marks unsaved edits, REVK the server revision that
// copy matches. On load, unsaved edits are pushed only if the server is still at REVK; otherwise its copy wins.
const FS={state:'wait',h:null,mod:0,dirty:false,t:null,busy:false,last:null,err:'',detail:'',loaded:false,initing:false};
let SRV=false;
async function srvGet(){const r=await fetch('api/data',{cache:'no-store'});if(r.status===404){FS.mod=0;return null}if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();FS.mod=j.rev||0;const d=j.data;if(!d||!d.plans||!d.loans)throw new Error('notbudget');return d}
async function srvRev(){const r=await fetch('api/rev',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return (await r.json()).rev||0}
async function srvPut(){const body=JSON.stringify({baseRev:FS.mod||null,data:sharedData()});const r=await fetch('api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body});if(r.status===409){const e=new Error('changed');e.name='Conflict';throw e}if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();FS.mod=j.rev;FS.dirty=false;FS.last=new Date();try{localStorage.removeItem(PEND);localStorage.setItem(REVK,String(j.rev))}catch(_){}}
const PEND=KEY+'_unsynced',REVK=KEY+'_rev';
const sharedData=()=>{const{cur,tab,flow,storeMap,...d}=S;d.loans=(d.loans||[]).map(({real,rp,live,link,auto,...l})=>l);return d};
function adopt(d){S={...d,months:d.months||{},cur:S.cur,tab:S.tab,flow:S.flow};LP={};try{localStorage.setItem(KEY,JSON.stringify(S));if(SRV)localStorage.setItem(REVK,String(FS.mod||0))}catch(_){}}
function setFS(st,err){FS.state=st;if(err!==undefined)FS.err=err;if(st==='ok')FS.detail='';fsUI()}
function fsErrMsg(e){FS.detail=e?`${e.name||'Error'}: ${e.message||e}`:'';try{console.error('[Budgeteer sync]',e)}catch(_){}return e&&e.message==='notbudget'?'The server sent something that isn’t budget data.':'Couldn’t reach the budget server.'}
async function fsLoad(){let pend=false,base=0;try{pend=localStorage.getItem(PEND)==='1';base=+localStorage.getItem(REVK)||0}catch(_){}
 const d=await srvGet();FS.loaded=true;if(!d){await srvPut();setFS('ok','');return}
 if(pend){if(base&&base===FS.mod){setFS('ok','');FS.dirty=true;return fsFlush()}try{localStorage.removeItem(PEND)}catch(_){}}
 adopt(d);rerender();setFS('ok','')}
// A save while the server copy is still loading ('wait') doesn't mark PEND; while the server is unreachable it does.
function fsQueue(){if(FS.state!=='ok'){if(FS.state!=='wait')try{localStorage.setItem(PEND,'1')}catch(_){}fsUI();return}FS.dirty=true;fsUI();clearTimeout(FS.t);FS.t=setTimeout(()=>fsFlush(),700)}
async function fsFlush(force){if(!SRV||!FS.loaded||FS.busy)return;if(force&&FS.state==='err'){FS.state='ok';FS.dirty=true}if(FS.state!=='ok'||!FS.dirty)return fsUI();FS.busy=true;
 try{await srvPut();FS.err='';FS.busy=false;fsUI()}
 catch(e){if(e&&e.name==='Conflict'){const quiet=FS.autoOnly;FS.autoOnly=false;try{const d=await srvGet();if(d){adopt(d);FS.dirty=false;FS.busy=false;try{localStorage.removeItem(PEND)}catch(_){}autoSave();rerender();if(!quiet)toast('Someone else saved a change at the same moment. Their version is showing; redo your last edit if it’s missing.')}}catch(_){}FS.busy=false;fsUI();return}
  try{localStorage.setItem(PEND,'1')}catch(_){}setFS('err',fsErrMsg(e))}FS.busy=false}
// Every 10 seconds (and when the page comes back into view): reconnect if needed, retry a failed save, or pick up
// changes saved from another browser.
async function fsPoll(){if(document.hidden||FS.busy)return;if(!SRV||!FS.loaded)return fsInit();if(FS.state==='err')return fsFlush(true);if(FS.state!=='ok')return;
 try{const rev=await srvRev();if(rev>FS.mod+1){if(FS.dirty)return fsFlush();FS.busy=true;const d=await srvGet();FS.busy=false;if(d){adopt(d);autoSave();rerender();toast('Updated with the latest changes from the server')}}FS.pf=0;if(FS.err){FS.err='';fsUI()}}
 catch(e){FS.busy=false;FS.pf=(FS.pf||0)+1;if(FS.pf>=3)setFS('err',fsErrMsg(e))}}
// Bank data loads after the budget, because which transactions to fetch depends on the budget's start date.
async function fsInit(){if(FS.initing)return;FS.initing=true;let first=false;
 try{const r=await fetch('api/health',{cache:'no-store'});if(!r.ok||(await r.json()).app!=='budgeteer')throw new Error('HTTP '+r.status);
  if(!SRV){SRV=true;FS.h={name:'the server'};first=true;rerender()}
  await fsLoad()}
 catch(e){setFS('err',fsErrMsg(e))}finally{FS.initing=false}
 if(first){bankLoad();openSync()}}
function fsUI(){const b=$('#sync'),pill=$('#spill'),sv=$('#saved');
 b.innerHTML=(DEMO?`<div class="sync warn"><i></i><div><b>Sample household</b><p>Made-up numbers to try things out. Nothing you change here is saved, and your real budget isn’t touched.</p></div><div class="sacts"><a class="btn g sm" href="./">Back to my budget</a></div></div>`:'')+(FS.state==='err'?`<div class="sync bad"><i></i><div><b>Not saved to the server</b><p>${esc(FS.err)} Your changes are safe in this browser. The app keeps retrying every 10 seconds.${FS.detail?`<br><span class="dim" style="font-size:13px">Details: ${esc(FS.detail)}</span>`:''}</p></div><div class="sacts"><button class="btn sm" data-act="fsRetry">Try again</button></div></div>`:'');
 const st=FS.state==='wait'?['','Connecting…']:FS.state==='ok'?['ok',FS.dirty||FS.busy?'Saving to the server…':`Saved to the server${FS.last?' at '+FS.last.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):''}`]:['bad','Not saved to the server. Saved in this browser only'];
 sv.innerHTML=`<span class="dim">Version 1</span> · <i class="sdot ${st[0]}"></i>${DEMO?'Sample data · nothing is saved':st[1]}`;
 pill.hidden=FS.state==='wait';pill.className='sp '+st[0];pill.innerHTML=`<i class="sdot ${st[0]}"></i>${FS.state==='ok'?(FS.dirty||FS.busy?'Saving…':'Synced'):'Not synced'}`}
setInterval(fsPoll,10000);addEventListener('focus',fsPoll);document.addEventListener('visibilitychange',()=>{if(!document.hidden){fsPoll();openSync()}});
addEventListener('beforeunload',e=>{if(FS.dirty&&FS.state==='ok'){fsFlush();e.preventDefault();e.returnValue=''}});

LP={};renderAll(true);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}fsUI();fsInit();
</script>
